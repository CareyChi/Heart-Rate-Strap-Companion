name: Release APKs

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and lint
        run: gradle :core:test :app:testArm32DebugUnitTest :app:testArm64DebugUnitTest :app:lintArm32Debug :app:lintArm64Debug --stacktrace
      - name: Build APKs
        run: |
          gradle :app:assembleArm32Release :app:assembleArm64Release --stacktrace
          mkdir -p release
          cp app/build/outputs/apk/arm32/release/app-arm32-release.apk release/Heart-Rate-Strap-Companion-v0.0.1-arm32.apk
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk release/Heart-Rate-Strap-Companion-v0.0.1-arm64.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          name: V0.0.1
          body: |
            V0.0.1
            - 实现标准 BLE 心率带连接与持续记录。
            - 实现实时心率、1 小时可滑动曲线、悬浮窗和历史详情。
            - 骑行记录暂未开发。
            - APK 当前使用 CI 默认/开发签名流程，不包含仓库内生产签名私钥。
