name: Release APKs

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify tested revision is still current main
        id: freshness
        run: |
          CURRENT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TESTED_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            TESTED_SHA="$CURRENT_SHA"
          fi
          echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_SHA" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.freshness.outputs.current == 'true'
        with:
          ref: ${{ steps.freshness.outputs.sha }}

      - uses: actions/setup-java@v4
        if: steps.freshness.outputs.current == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.freshness.outputs.current == 'true'
        with:
          gradle-version: '8.9'

      - name: Re-run release gate
        if: steps.freshness.outputs.current == 'true'
        run: gradle :core:test :app:testArm32DebugUnitTest :app:testArm64DebugUnitTest :app:lintArm32Debug :app:lintArm64Debug --stacktrace

      - name: Build APKs
        if: steps.freshness.outputs.current == 'true'
        run: |
          gradle :app:assembleArm32Release :app:assembleArm64Release --stacktrace
          mkdir -p release
          cp app/build/outputs/apk/arm32/release/app-arm32-release.apk release/Heart-Rate-Strap-Companion-v0.0.2-arm32.apk
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk release/Heart-Rate-Strap-Companion-v0.0.2-arm64.apk

      - name: Remove previous V0.0.2 release after successful build
        if: steps.freshness.outputs.current == 'true'
        run: |
          if gh release view v0.0.2 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete v0.0.2 --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.0.2" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.0.2"
          fi

      - name: Publish replacement GitHub Release V0.0.2
        if: steps.freshness.outputs.current == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.2
          target_commitish: ${{ steps.freshness.outputs.sha }}
          files: release/*.apk
          name: V0.0.2
          body: |
            V0.0.2
            - 新增独立的启动显示策略 DisplayBackgroundPolicy：应用启动时对内置面板类型进行保守检测，便于后续单独修改或移除该功能。
            - 检测到明确 LCD / IPS / TFT / Mini-LED 面板证据时，页面背景、卡片/组件背景以及悬浮窗背景统一切换为纯黑；主要操作按钮继续保留原有按钮配色。
            - 检测到 OLED / AMOLED / P-OLED / LTPO，或设备未暴露足够可靠的面板信息时，完整保留现有深灰 UI 样式，避免错误识别导致不必要的主题变化。
            - LCD 检测采用可读取的面板 sysfs 描述与 OEM 显示/面板系统属性组合判断；不依赖 Android 并不存在的公开“LCD/OLED”应用 API。
            - 窗口状态栏、导航栏和 DecorView 背景同步使用启动时确定的背景颜色；悬浮窗通过统一运行时调色板自动跟随。
            - 新增显示面板分类单元测试，覆盖 LCD、OLED、OLED+TFT 描述以及未知面板回退行为。
            - 主界面右上角设置与历史记录按钮保持 12dp 横向间距、匹配的矢量图标、深色背景与弱白色环形阴影。
            - “OLED防烧屏”继续保持默认关闭；开启后前台页面每 60 秒在约 ±2dp 范围内进行九宫格像素位移。
            - 悬浮窗继续使用独立 20dp 坐标轴列 + 2dp 间隔，并保留拖动位置持久化、约 3dp 弱白色柔光、173×150dp 总尺寸。
            - 未开启“防止意外中断”时仅在手动停止后生成记录；开启后持续增量保存以支持异常退出恢复。
            - 同时提供 arm32 (armeabi-v7a) 与 arm64 (arm64-v8a) APK。
