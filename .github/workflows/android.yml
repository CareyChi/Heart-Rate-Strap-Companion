name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle :core:test :app:testArm32DebugUnitTest :app:testArm64DebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintArm32Debug :app:lintArm64Debug --stacktrace
      - name: Build release APKs
        run: |
          gradle :app:assembleArm32Release :app:assembleArm64Release --stacktrace
          mkdir -p release
          cp app/build/outputs/apk/arm32/release/app-arm32-release.apk release/Heart-Rate-Strap-Companion-v0.0.1-arm32.apk
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk release/Heart-Rate-Strap-Companion-v0.0.1-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Heart-Rate-Strap-Companion-v0.0.1
          path: release/*.apk
          if-no-files-found: error
