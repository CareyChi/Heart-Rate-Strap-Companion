plugins {
    id 'com.android.application'
}

android {
    namespace 'com.careychi.hrstrap'
    compileSdk 35

    defaultConfig {
        // V0.0.2B is intentionally a separate installable app, not an update of the main build.
        applicationId 'com.careychi.hrstrap.devfwmodify'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.0.2B'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions += 'abi'
    productFlavors {
        arm32 {
            dimension 'abi'
            ndk { abiFilters 'armeabi-v7a' }
        }
        arm64 {
            dimension 'abi'
            ndk { abiFilters 'arm64-v8a' }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // This one-off branch deliberately emits unsigned release APKs. The dedicated
            // dev_FW-modify workflow signs them with a newly generated V0.0.2B-only key.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
